# Vessel class catalog: 5 vessel types x 3 size tiers = 15 classes.
#
# admiralty_coefficient/day_rate/aux_load scale with tier; DWT and speed
# ranges are representative for each type. compatible_fuels reflects today's
# real bunkering-infrastructure limits (HFO/MDO universal; LNG at Medium and
# Large tiers; methanol/hydrogen/ammonia only where early-adopter fleets
# exist today) so the optimizer faces genuine fuel-availability tradeoffs
# rather than an unconstrained free choice.

vessel_classes:
  - id: CONTAINER_SMALL
    type: Container Ship
    tier: Small
    dwt_tonnes: 10000
    admiralty_coefficient: 380
    day_rate_usd: 6000
    min_speed_knots: 12
    max_speed_knots: 20
    aux_load_kw: 300
    compatible_fuels: [HFO, MDO, HYDROGEN]
